name: lint
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    uses: pschmitt/ci-workflows/.github/workflows/rust-lint.yaml@main
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --check static/app.js
