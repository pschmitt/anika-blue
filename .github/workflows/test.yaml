name: test
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
env:
  RUST_BACKTRACE: 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
  # Package builds and checks also run on nixbot; the NixOS VM test needs
  # /dev/kvm, which only the GitHub runners have.
  nixos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L '.#checks.x86_64-linux.nixos'
  # Native ARM packages publish to niks3 before the checks job consumes them.
  nix-aarch64:
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-build.yaml@main
    with:
      runner: ubuntu-26.04-arm
      system: aarch64-linux
      pin-prefix: gh-anika-blue-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  nix-aarch64-checks:
    needs: nix-aarch64
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-checks.yaml@main
    with:
      runner: ubuntu-26.04-arm
      system: aarch64-linux
      full-flake-check: false
      exclude-checks: '["nixos"]'
      pin-prefix: gh-anika-blue-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
