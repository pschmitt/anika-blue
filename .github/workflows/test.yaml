name: test
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
env:
  RUST_BACKTRACE: 1
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
  # Package builds and checks also run on Circus; the NixOS VM test needs
  # /dev/kvm, which only the GitHub runners have.
  nixos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - uses: pschmitt/ci-workflows/.github/actions/nix-setup@main
        with:
          extra-conf: |
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L '.#checks.x86_64-linux.nixos'
