services:
  anika-blue:
    image: ghcr.io/pschmitt/anika-blue:latest
    build: .
    ports:
      - "5000:5000"
    volumes:
      - anika-blue-data:/data
    environment:
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY to keep sessions across restarts}
    restart: unless-stopped

volumes:
  anika-blue-data:
